# shellcheck shell=bash
# Levante (DKRZ). Any value can be overridden in nrt_forcing.conf or the environment.
NRT_PIXI_BIN=${NRT_PIXI_BIN:-/sw/bin}
NRT_SLURM_PARTITION=${NRT_SLURM_PARTITION:-compute}
NRT_SNAKEMAKE_PROFILE=${NRT_SNAKEMAKE_PROFILE:-slurm_profiles/slurm}
NRT_PRODUCER_CONFIG=${NRT_PRODUCER_CONFIG:-config/config-levante.yaml}
# The chain is cheaper than the queue it would wait in. 0 submits it instead.
NRT_LOCAL_COMPUTE=${NRT_LOCAL_COMPUTE:-1}
# A tco1279 day is 9 GB of intermediates, which do not belong in a shared login node's /tmp.
NRT_TMPDIR=${NRT_TMPDIR:-${ROOT}/tmp}
