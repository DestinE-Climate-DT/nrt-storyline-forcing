# shellcheck shell=bash
# LUMI (CSC). Any value can be overridden in nrt_forcing.conf or the environment.
# Two candidates, in PATH order: a CLI in the clone, then the installer's usual
# place. The clone-local one keeps a machine working when $HOME is cleaned out.
NRT_PIXI_BIN=${NRT_PIXI_BIN:-${ROOT}/.pixi-home/bin:${HOME}/.pixi/bin}
NRT_SLURM_PARTITION=${NRT_SLURM_PARTITION:-small}
NRT_SNAKEMAKE_PROFILE=${NRT_SNAKEMAKE_PROFILE:-slurm_profiles/slurm}
NRT_PRODUCER_CONFIG=${NRT_PRODUCER_CONFIG:-config/config-lumi.yaml}
# A compute node's $TMPDIR is a tmpfs charged to the job's own memory.
NRT_TMPDIR=${NRT_TMPDIR:-${ROOT}/tmp}
# The chain is cheaper than the queue it would wait in. 0 submits it instead.
NRT_LOCAL_COMPUTE=${NRT_LOCAL_COMPUTE:-1}
# pixi caches packages under $HOME wherever the clone is, and a solve exhausts the 100 K file quota.
export PIXI_CACHE_DIR=${PIXI_CACHE_DIR:-${ROOT}/.pixi-cache}
# Private by default. Point NRT_ERA5_DIR at a project directory to share one cache.
NRT_ERA5_DIR=${NRT_ERA5_DIR:-${ROOT}/era5-cache}
