# shellcheck shell=bash
# LUMI (CSC). Any value can be overridden in nrt_forcing.conf or the environment.
NRT_PIXI_BIN=${NRT_PIXI_BIN:-${HOME}/.pixi/bin}
NRT_SLURM_PARTITION=${NRT_SLURM_PARTITION:-small}
NRT_SNAKEMAKE_PROFILE=${NRT_SNAKEMAKE_PROFILE:-slurm_profiles/slurm}
NRT_PRODUCER_CONFIG=${NRT_PRODUCER_CONFIG:-config/config-lumi.yaml}
# A compute node's $TMPDIR is a tmpfs charged to the job's own memory.
NRT_TMPDIR=${NRT_TMPDIR:-${ROOT}/tmp}
# Private by default. Point NRT_ERA5_DIR at a project directory to share one cache.
NRT_ERA5_DIR=${NRT_ERA5_DIR:-${ROOT}/era5-cache}
